# ==============================================================================
# Pochita Kernel Companion Configuration
# ==============================================================================

# [Network Optimization - TCP BBR]
# 1 = 启用 BBR 拥塞控制算法, 0 = 保持系统默认
ENABLE_BBR=1

# [Network Optimization - TTL / Hop Limit Spoofing]
# 1 = 启用出站数据包 TTL/HL 伪装修改, 0 = 禁用
ENABLE_TTL=0
# 目标 TTL 数值 (常见标准值: 64 = 手机原生, 128 = Windows PC)
TTL_VALUE=64

# [Future Kernel Services]
# 预留给未来新增自研驱动或后台任务的开关
ENABLE_EXTRA_SERVICES=1
