[project]
name = "gki-builder"
version = "0.1.0"
description = "Automated GKI kernel build and AnyKernel3 packaging pipeline"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "click>=8.1.7",
    "rich>=13.7.0",
    "pyyaml>=6.0.1",
]

[project.scripts]
gki = "gki_builder.cli:main"
gki-builder = "gki_builder.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
