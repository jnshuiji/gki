<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快捷键助手</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #121824;
            --surface-hover: #182232;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: #388bfd;
            --accent: #388bfd;
            --accent-glow: rgba(56, 139, 253, 0.25);
            --success: #2ea043;
            --warning: #f0883e;
            --amber: #e3b341;
            --text: #f0f6fc;
            --text-sub: #8b949e;
            --radius-lg: 16px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 60px;
            line-height: 1.4;
            user-select: none;
        }

        /* 顶部导航栏 */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            font-size: 19px;
            font-weight: 700;
            letter-spacing: -0.3px;
        }

        .brand-subtitle {
            font-size: 11px;
            color: var(--text-sub);
            font-weight: 400;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(46, 160, 67, 0.12);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #3fb950;
            box-shadow: 0 0 6px #3fb950;
        }

        /* 分组标题 */
        .section-label {
            font-size: 11px;
            font-weight: 600;
            text-transform: uppercase;
            letter-spacing: 0.8px;
            color: var(--text-sub);
            margin: 16px 4px 8px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 卡片容器 */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
            transition: border-color 0.2s, background-color 0.2s;
        }

        .card:active {
            border-color: rgba(56, 139, 253, 0.3);
        }

        /* 快捷手电筒卡片 */
        .torch-card {
            display: flex;
            align-items: center;
            justify-content: space-between;
            background: linear-gradient(135deg, rgba(227, 179, 65, 0.08) 0%, rgba(18, 24, 36, 1) 100%);
            border: 1px solid rgba(227, 179, 65, 0.25);
        }

        .torch-info {
            display: flex;
            align-items: center;
            gap: 12px;
        }

        .torch-icon {
            width: 38px;
            height: 38px;
            border-radius: var(--radius-md);
            background: rgba(227, 179, 65, 0.15);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 18px;
        }

        .torch-title {
            font-size: 14px;
            font-weight: 600;
        }

        .torch-meta {
            font-size: 11px;
            color: var(--text-sub);
        }

        /* 手势卡片布局 */
        .gesture-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .gesture-identity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gesture-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(56, 139, 253, 0.12);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .gesture-name {
            font-size: 14px;
            font-weight: 600;
        }

        .gesture-controls {
            display: grid;
            grid-template-columns: 1fr auto;
            gap: 8px;
            align-items: center;
        }

        /* 表单控件 */
        .select-field, .input-field {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 8px 10px;
            font-size: 12.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        .select-field:focus, .input-field:focus {
            border-color: var(--border-focus);
        }

        /* Switch 开关 */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e2634;
            border: 1px solid var(--border);
            border-radius: 22px;
            transition: .25s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: #f0f6fc;
            border-radius: 50%;
            transition: .25s;
        }

        input:checked + .slider {
            background-color: var(--success);
            border-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* 滑块 */
        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 8px;
            padding-top: 8px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11.5px;
            color: var(--text-sub);
        }

        .range-slider {
            flex: 1;
            accent-color: var(--accent);
            height: 4px;
        }

        /* 按钮体系 */
        .btn {
            background: #182232;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
            background: #202b3e;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-amber {
            background: rgba(227, 179, 65, 0.15);
            color: #ffd33d;
            border-color: rgba(227, 179, 65, 0.35);
        }

        .btn-amber:active {
            background: rgba(227, 179, 65, 0.3);
        }

        .btn-icon {
            padding: 7px 10px;
            min-width: 32px;
        }

        .field-group {
            margin-bottom: 10px;
        }

        .field-label {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
            display: block;
        }

        /* 紧凑日志终端 */
        .terminal {
            background: #05080e;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            color: #7ee787;
            max-height: 120px;
            min-height: 60px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- 顶部状态栏 -->
    <div class="app-bar">
        <div>
            <div class="brand-title">快捷键助手</div>
            <div class="brand-subtitle">OnePlus 15T 实体按键 (KeyCode 735)</div>
        </div>
        <div class="status-pill" id="statusBadge">
            <div class="dot"></div>
            <span id="statusText">正在连接...</span>
        </div>
    </div>

    <!-- 手电筒快速控制卡片 -->
    <div class="card torch-card">
        <div class="torch-info">
            <div class="torch-icon">🔦</div>
            <div>
                <div class="torch-title">硬件手电筒</div>
                <div class="torch-meta">PMIC 闪光灯直驱 · 0ms 延迟</div>
            </div>
        </div>
        <button class="btn btn-amber" onclick="toggleTorchDirectly()">
            切换开关
        </button>
    </div>

    <!-- 手势映射配置 -->
    <div class="section-label">手势动作</div>

    <!-- 1. 单击 -->
    <div class="card">
        <div class="gesture-header">
            <div class="gesture-identity">
                <div class="gesture-badge">1×</div>
                <div class="gesture-name">单击</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="switchShortPress" checked onchange="toggleGesture('short_press', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="gesture-controls">
            <select class="select-field" id="selectShortPress" onchange="changeActionType('short_press', this.value)">
                <option value="ha">Home Assistant (single)</option>
                <option value="torch">手电筒开关</option>
                <option value="log">仅输出日志</option>
            </select>
            <button class="btn btn-icon" title="测试此动作" onclick="triggerTest('short')">⚡ 测试</button>
        </div>
    </div>

    <!-- 2. 双击 -->
    <div class="card">
        <div class="gesture-header">
            <div class="gesture-identity">
                <div class="gesture-badge">2×</div>
                <div class="gesture-name">双击</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="switchDoubleTap" checked onchange="toggleGesture('double_tap', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="gesture-controls">
            <select class="select-field" id="selectDoubleTap" onchange="changeActionType('double_tap', this.value)">
                <option value="ha">Home Assistant (double)</option>
                <option value="torch">手电筒开关</option>
                <option value="log">仅输出日志</option>
            </select>
            <button class="btn btn-icon" title="测试此动作" onclick="triggerTest('double')">⚡ 测试</button>
        </div>
        <div class="slider-row">
            <span>双击窗口</span>
            <input type="range" class="range-slider" id="doubleTapSlider" min="200" max="500" step="50" value="300" onchange="updateDoubleTapTimeout(this.value)">
            <span id="doubleTapVal">300ms</span>
        </div>
    </div>

    <!-- 3. 长按 -->
    <div class="card">
        <div class="gesture-header">
            <div class="gesture-identity">
                <div class="gesture-badge" style="color: #ffd33d; background: rgba(227,179,65,0.12);">⏱️</div>
                <div class="gesture-name">长按 (>500ms)</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="switchLongPress" checked onchange="toggleGesture('long_press', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <div class="gesture-controls">
            <select class="select-field" id="selectLongPress" onchange="changeActionType('long_press', this.value)">
                <option value="torch">手电筒 (硬件直驱 0ms)</option>
                <option value="ha">Home Assistant (long)</option>
                <option value="log">仅输出日志</option>
            </select>
            <button class="btn btn-icon" title="测试此动作" onclick="triggerTest('long')">⚡ 测试</button>
        </div>
    </div>

    <!-- Home Assistant 直连配置 -->
    <div class="section-label">Home Assistant</div>
    <div class="card">
        <div class="field-group">
            <label class="field-label">服务器地址</label>
            <input type="text" class="input-field" id="haUrl" placeholder="例: http://192.168.1.100:8123">
        </div>
        <div class="field-group">
            <label class="field-label">长期访问令牌 (Token)</label>
            <input type="password" class="input-field" id="haToken" placeholder="eyJhbGciOiJIUz...">
        </div>
        <div class="field-group" style="margin-bottom: 12px;">
            <label class="field-label">实体 ID</label>
            <input type="text" class="input-field" id="haEntityId" value="event.action_button">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn" onclick="testHaConnection()">连通性测试</button>
            <button class="btn btn-primary" onclick="saveHaConfig()">保存配置</button>
        </div>
    </div>

    <!-- 运行日志 -->
    <div class="section-label">
        <span>执行日志</span>
        <span onclick="clearLog()" style="cursor: pointer; color: var(--accent); font-weight: normal;">清空</span>
    </div>
    <div class="terminal" id="terminalBox">等待操作...</div>

    <script>
        const DAEMON_BIN = "/data/adb/modules/action_key/bin/action_key_daemon";

        function log(msg) {
            const box = document.getElementById("terminalBox");
            const time = new Date().toLocaleTimeString();
            box.textContent += `\n[${time}] ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        function clearLog() {
            document.getElementById("terminalBox").textContent = "日志已清空";
        }

        let execSeq = 0;
        function isKsuAvailable() {
            return typeof window.ksu !== "undefined" && typeof window.ksu.exec === "function";
        }

        function showToast(msg) {
            try {
                if (typeof window.ksu !== "undefined" && typeof window.ksu.toast === "function") {
                    window.ksu.toast(msg);
                }
            } catch (e) {}
        }

        function runCmd(cmd) {
            return new Promise((resolve) => {
                if (!isKsuAvailable()) {
                    resolve({ errno: 0, stdout: "[模拟] " + cmd, stderr: "" });
                    return;
                }

                const cbName = `ksu_exec_cb_${Date.now()}_${execSeq++}`;
                window[cbName] = (errno, stdout, stderr) => {
                    delete window[cbName];
                    resolve({
                        errno: (typeof errno === "number" ? errno : 0),
                        stdout: stdout || "",
                        stderr: stderr || ""
                    });
                };

                try {
                    window.ksu.exec(cmd, "{}", cbName);
                } catch (e) {
                    delete window[cbName];
                    resolve({ errno: -1, stdout: "", stderr: String(e) });
                }
            });
        }

        async function initPage() {
            const res = await runCmd(`${DAEMON_BIN} status`);
            if (res.errno === 0 && res.stdout) {
                try {
                    const data = JSON.parse(res.stdout);
                    document.getElementById("statusText").innerText = data.driver_loaded ? "驱动正常运行" : "驱动待就绪";
                    
                    if (data.config && data.config.home_assistant) {
                        document.getElementById("haUrl").value = data.config.home_assistant.base_url || "";
                        document.getElementById("haToken").value = data.config.home_assistant.token || "";
                        document.getElementById("haEntityId").value = data.config.home_assistant.entity_id || "event.action_button";
                    }

                    if (data.config && data.config.actions) {
                        const acts = data.config.actions;
                        document.getElementById("switchShortPress").checked = acts.short_press.enabled;
                        document.getElementById("selectShortPress").value = acts.short_press.action_type;

                        document.getElementById("switchDoubleTap").checked = acts.double_tap.enabled;
                        document.getElementById("selectDoubleTap").value = acts.double_tap.action_type;

                        document.getElementById("switchLongPress").checked = acts.long_press.enabled;
                        document.getElementById("selectLongPress").value = acts.long_press.action_type;
                    }

                    if (data.config && data.config.double_tap_timeout_ms) {
                        document.getElementById("doubleTapSlider").value = data.config.double_tap_timeout_ms;
                        document.getElementById("doubleTapVal").innerText = data.config.double_tap_timeout_ms + "ms";
                    }

                    log("配置加载完毕");
                } catch (e) {
                    log("解析配置失败");
                }
            } else {
                document.getElementById("statusText").innerText = "服务待命";
            }
        }

        async function saveHaConfig() {
            const url = document.getElementById("haUrl").value.trim();
            const token = document.getElementById("haToken").value.trim();
            const entity = document.getElementById("haEntityId").value.trim() || "event.action_button";

            const res = await runCmd(`${DAEMON_BIN} config set-ha "${url}" "${token}" "${entity}"`);
            if (res.errno === 0) {
                log("HA 配置已保存");
                showToast("HA 配置已保存");
            } else {
                log("保存失败: " + (res.stderr || res.stdout));
            }
        }

        async function testHaConnection() {
            log("测试 HA 连通性...");
            const res = await runCmd(`${DAEMON_BIN} ha test`);
            if (res.errno === 0) {
                log(res.stdout || "连接成功");
                showToast("HA 连接成功");
            } else {
                log("连接失败: " + (res.stderr || res.stdout));
                showToast("HA 连接失败");
            }
        }

        async function toggleTorchDirectly() {
            const res = await runCmd(`${DAEMON_BIN} torch toggle`);
            if (res.errno === 0) {
                log("手电筒已切换");
                showToast("手电筒已切换");
            } else {
                log("切换手电筒失败");
            }
        }

        async function toggleGesture(gesture, enabled) {
            const res = await runCmd(`${DAEMON_BIN} config set ${gesture} enabled ${enabled}`);
            if (res.errno === 0) {
                log(`${gesture} 状态: ${enabled}`);
            }
        }

        async function changeActionType(gesture, actionType) {
            let defaultPayload = "";
            if (actionType === "ha") {
                defaultPayload = gesture === "short_press" ? "single" : (gesture === "double_tap" ? "double" : "long");
            } else if (actionType === "torch") {
                defaultPayload = "toggle";
            }

            await runCmd(`${DAEMON_BIN} config set ${gesture} action_type ${actionType}`);
            await runCmd(`${DAEMON_BIN} config set ${gesture} payload ${defaultPayload}`);
            log(`${gesture} -> ${actionType}`);
            showToast("动作已更新");
        }

        async function updateDoubleTapTimeout(val) {
            document.getElementById("doubleTapVal").innerText = val + "ms";
            await runCmd(`${DAEMON_BIN} config set-timeout ${val}`);
            log(`双击窗口: ${val}ms`);
        }

        async function triggerTest(gesture) {
            log(`测试手势: ${gesture}`);
            const res = await runCmd(`${DAEMON_BIN} test ${gesture}`);
            if (res.errno === 0) {
                log(res.stdout || "测试成功");
                showToast(`模拟 ${gesture} 成功`);
            } else {
                log("测试失败: " + (res.stderr || res.stdout));
            }
        }

        window.onload = initPage;
    </script>
</body>
</html>
