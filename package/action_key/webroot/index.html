<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>快捷键助手</title>
    <style>
        :root {
            --bg: #090d16;
            --surface: #121824;
            --surface-hover: #182232;
            --border: rgba(255, 255, 255, 0.08);
            --border-focus: #388bfd;
            --accent: #388bfd;
            --success: #2ea043;
            --text: #f0f6fc;
            --text-sub: #8b949e;
            --radius-lg: 14px;
            --radius-md: 10px;
            --radius-sm: 6px;
        }

        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "PingFang SC", "Microsoft YaHei", sans-serif;
            background-color: var(--bg);
            color: var(--text);
            padding: 16px;
            padding-bottom: 60px;
            line-height: 1.4;
            user-select: none;
        }

        /* 顶部导航栏 */
        .app-bar {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 16px;
            padding-bottom: 12px;
            border-bottom: 1px solid var(--border);
        }

        .brand-title {
            font-size: 18px;
            font-weight: 700;
            letter-spacing: -0.2px;
        }

        .brand-subtitle {
            font-size: 11.5px;
            color: var(--text-sub);
            font-weight: 400;
        }

        .status-pill {
            display: inline-flex;
            align-items: center;
            gap: 6px;
            padding: 4px 10px;
            border-radius: 99px;
            font-size: 11px;
            font-weight: 600;
            background: rgba(46, 160, 67, 0.12);
            color: #3fb950;
            border: 1px solid rgba(46, 160, 67, 0.3);
        }

        .dot {
            width: 7px;
            height: 7px;
            border-radius: 50%;
            background-color: #3fb950;
            box-shadow: 0 0 6px #3fb950;
        }

        /* 分组标题 */
        .section-label {
            font-size: 11.5px;
            font-weight: 600;
            color: var(--text-sub);
            margin: 16px 4px 8px 4px;
            display: flex;
            align-items: center;
            justify-content: space-between;
        }

        /* 卡片容器 */
        .card {
            background: var(--surface);
            border: 1px solid var(--border);
            border-radius: var(--radius-lg);
            padding: 14px;
            margin-bottom: 10px;
        }

        /* 手势卡片布局 */
        .gesture-header {
            display: flex;
            align-items: center;
            justify-content: space-between;
            margin-bottom: 10px;
        }

        .gesture-identity {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .gesture-badge {
            width: 28px;
            height: 28px;
            border-radius: 8px;
            background: rgba(56, 139, 253, 0.12);
            color: var(--accent);
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 12px;
            font-weight: 700;
        }

        .gesture-name {
            font-size: 14px;
            font-weight: 600;
        }

        /* 表单控件 */
        .select-field, .input-field {
            width: 100%;
            background: #090d16;
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            color: var(--text);
            padding: 8px 10px;
            font-size: 12.5px;
            outline: none;
            transition: border-color 0.2s;
        }

        .select-field:focus, .input-field:focus {
            border-color: var(--border-focus);
        }

        /* 带图标切换的输入框组合 */
        .input-with-button {
            display: flex;
            gap: 6px;
            align-items: center;
        }

        /* Switch 开关 */
        .switch {
            position: relative;
            display: inline-block;
            width: 40px;
            height: 22px;
        }

        .switch input {
            opacity: 0;
            width: 0;
            height: 0;
        }

        .slider {
            position: absolute;
            cursor: pointer;
            top: 0; left: 0; right: 0; bottom: 0;
            background-color: #1e2634;
            border: 1px solid var(--border);
            border-radius: 22px;
            transition: .25s;
        }

        .slider:before {
            position: absolute;
            content: "";
            height: 16px;
            width: 16px;
            left: 2px;
            bottom: 2px;
            background-color: #f0f6fc;
            border-radius: 50%;
            transition: .25s;
        }

        input:checked + .slider {
            background-color: var(--success);
            border-color: var(--success);
        }

        input:checked + .slider:before {
            transform: translateX(18px);
        }

        /* 滑块行 */
        .slider-row {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 10px;
            margin-top: 10px;
            padding-top: 10px;
            border-top: 1px solid rgba(255, 255, 255, 0.04);
            font-size: 11.5px;
            color: var(--text-sub);
        }

        .range-slider {
            flex: 1;
            accent-color: var(--accent);
            height: 4px;
        }

        /* 按钮 */
        .btn {
            background: #182232;
            color: var(--text);
            border: 1px solid var(--border);
            border-radius: var(--radius-sm);
            padding: 7px 12px;
            font-size: 12px;
            font-weight: 600;
            cursor: pointer;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            gap: 6px;
            transition: background 0.2s, transform 0.1s;
        }

        .btn:active {
            transform: scale(0.97);
            background: #202b3e;
        }

        .btn-primary {
            background: var(--accent);
            border-color: var(--accent);
            color: #ffffff;
        }

        .btn-icon {
            padding: 7px 10px;
            font-size: 13px;
        }

        .btn-link {
            background: none;
            border: none;
            color: var(--accent);
            font-size: 11.5px;
            padding: 0;
            cursor: pointer;
            font-weight: 500;
        }

        .field-group {
            margin-bottom: 10px;
        }

        .field-label {
            font-size: 11px;
            color: var(--text-sub);
            margin-bottom: 4px;
            display: block;
        }

        .field-hint {
            font-size: 10.5px;
            color: #6e7681;
            margin-top: 3px;
        }

        /* 日志终端 */
        .terminal {
            background: #05080e;
            border: 1px solid var(--border);
            border-radius: var(--radius-md);
            padding: 10px;
            font-family: ui-monospace, SFMono-Regular, Menlo, Monaco, Consolas, monospace;
            font-size: 11px;
            color: #7ee787;
            max-height: 120px;
            min-height: 60px;
            overflow-y: auto;
            white-space: pre-wrap;
            word-break: break-all;
        }
    </style>
</head>
<body>

    <!-- 顶部状态栏 -->
    <div class="app-bar">
        <div>
            <div class="brand-title">快捷键助手</div>
            <div class="brand-subtitle">物理实体按键映射</div>
        </div>
        <div class="status-pill" id="statusBadge">
            <div class="dot"></div>
            <span id="statusText">正在连接...</span>
        </div>
    </div>

    <!-- 手势动作配置 -->
    <div class="section-label">手势动作</div>

    <!-- 1. 单击 -->
    <div class="card">
        <div class="gesture-header">
            <div class="gesture-identity">
                <div class="gesture-badge">1×</div>
                <div class="gesture-name">单击</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="switchShortPress" checked onchange="toggleGesture('short_press', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <select class="select-field" id="selectShortPress" onchange="changeActionType('short_press', this.value)">
            <option value="ha">Home Assistant</option>
            <option value="torch">手电筒</option>
            <option value="log">仅记录日志</option>
        </select>
    </div>

    <!-- 2. 双击 -->
    <div class="card">
        <div class="gesture-header">
            <div class="gesture-identity">
                <div class="gesture-badge">2×</div>
                <div class="gesture-name">双击</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="switchDoubleTap" checked onchange="toggleGesture('double_tap', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <select class="select-field" id="selectDoubleTap" onchange="changeActionType('double_tap', this.value)">
            <option value="ha">Home Assistant</option>
            <option value="torch">手电筒</option>
            <option value="log">仅记录日志</option>
        </select>
        <div class="slider-row">
            <span>双击判定时间</span>
            <input type="range" class="range-slider" id="doubleTapSlider" min="200" max="500" step="50" value="300" onchange="updateDoubleTapTimeout(this.value)">
            <span id="doubleTapVal">300ms</span>
        </div>
    </div>

    <!-- 3. 长按 -->
    <div class="card">
        <div class="gesture-header">
            <div class="gesture-identity">
                <div class="gesture-badge" style="color: #ffd33d; background: rgba(227,179,65,0.12);">⏱️</div>
                <div class="gesture-name">长按</div>
            </div>
            <label class="switch">
                <input type="checkbox" id="switchLongPress" checked onchange="toggleGesture('long_press', this.checked)">
                <span class="slider"></span>
            </label>
        </div>
        <select class="select-field" id="selectLongPress" onchange="changeActionType('long_press', this.value)">
            <option value="ha">Home Assistant</option>
            <option value="torch">手电筒</option>
            <option value="log">仅记录日志</option>
        </select>
        <div class="slider-row">
            <span>长按触发时间</span>
            <input type="range" class="range-slider" id="longPressSlider" min="200" max="2000" step="50" value="500" onchange="updateLongPressTimeout(this.value)">
            <span id="longPressVal">500ms</span>
        </div>
    </div>

    <!-- Home Assistant 直连配置 -->
    <div class="section-label">Home Assistant</div>
    <div class="card">
        <div class="field-group">
            <div style="display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px;">
                <label class="field-label" style="margin-bottom: 0;">局域网 WiFi 属性</label>
                <button class="btn-link" type="button" onclick="detectCurrentWifi()">识别当前 WiFi</button>
            </div>
            <input type="text" class="input-field" id="haLanSsid" placeholder="WiFi 名称，多个逗号隔开">
            <div class="field-hint">处于设定的局域网 WiFi 时使用局域网，离开时使用公网</div>
        </div>
        <div class="field-group">
            <label class="field-label">局域网地址</label>
            <input type="text" class="input-field" id="haLanUrl" placeholder="例: http://10.0.0.1:8123">
        </div>
        <div class="field-group">
            <label class="field-label">公网地址</label>
            <input type="text" class="input-field" id="haWanUrl" placeholder="例: https://ha.example.com:8123">
        </div>
        <div class="field-group">
            <label class="field-label">长期访问令牌</label>
            <div class="input-with-button">
                <input type="password" class="input-field" id="haToken" placeholder="长期访问令牌">
                <button class="btn btn-icon" id="btnToggleToken" type="button" onclick="toggleTokenVisibility()">👁️</button>
            </div>
        </div>
        <div class="field-group" style="margin-bottom: 12px;">
            <label class="field-label">实体 ID</label>
            <input type="text" class="input-field" id="haEntityId" value="event.action_button">
        </div>
        <div style="display: grid; grid-template-columns: 1fr 1fr; gap: 8px;">
            <button class="btn" onclick="testHaConnection()">连通性测试</button>
            <button class="btn btn-primary" onclick="saveHaConfig()">保存配置</button>
        </div>
    </div>

    <!-- 运行日志 -->
    <div class="section-label">
        <span>执行日志</span>
        <span onclick="clearLog()" style="cursor: pointer; color: var(--accent); font-weight: normal;">清空</span>
    </div>
    <div class="terminal" id="terminalBox">正在加载运行日志...</div>

    <script>
        const DAEMON_BIN = "/data/adb/modules/action_key/bin/action_key_daemon";

        let isPollingLogs = false;
        let lastDaemonLogs = "";

        async function fetchDaemonLogs() {
            if (isPollingLogs) return;
            isPollingLogs = true;
            try {
                const res = await runCmd(`${DAEMON_BIN} logs 25`);
                if (res.errno === 0 && res.stdout) {
                    const text = res.stdout.trim();
                    if (text && text !== lastDaemonLogs) {
                        lastDaemonLogs = text;
                        const box = document.getElementById("terminalBox");
                        box.textContent = text;
                        box.scrollTop = box.scrollHeight;
                    }
                }
            } catch (e) {
            } finally {
                isPollingLogs = false;
            }
        }

        function log(msg) {
            const box = document.getElementById("terminalBox");
            const time = new Date().toLocaleTimeString();
            box.textContent += `\n[${time}] ${msg}`;
            box.scrollTop = box.scrollHeight;
        }

        async function clearLog() {
            await runCmd(`${DAEMON_BIN} clear-logs`);
            lastDaemonLogs = "";
            document.getElementById("terminalBox").textContent = "日志已清空";
        }

        let execSeq = 0;
        function isKsuAvailable() {
            return typeof window.ksu !== "undefined" && typeof window.ksu.exec === "function";
        }

        function showToast(msg) {
            try {
                if (typeof window.ksu !== "undefined" && typeof window.ksu.toast === "function") {
                    window.ksu.toast(msg);
                }
            } catch (e) {}
        }

        function runCmd(cmd) {
            return new Promise((resolve) => {
                if (!isKsuAvailable()) {
                    resolve({ errno: 0, stdout: "[模拟] " + cmd, stderr: "" });
                    return;
                }

                const cbName = `ksu_exec_cb_${Date.now()}_${execSeq++}`;
                window[cbName] = (errno, stdout, stderr) => {
                    delete window[cbName];
                    resolve({
                        errno: (typeof errno === "number" ? errno : 0),
                        stdout: stdout || "",
                        stderr: stderr || ""
                    });
                };

                try {
                    window.ksu.exec(cmd, "{}", cbName);
                } catch (e) {
                    delete window[cbName];
                    resolve({ errno: -1, stdout: "", stderr: String(e) });
                }
            });
        }

        function toggleTokenVisibility() {
            const input = document.getElementById("haToken");
            const btn = document.getElementById("btnToggleToken");
            if (input.type === "password") {
                input.type = "text";
                btn.textContent = "🙈";
            } else {
                input.type = "password";
                btn.textContent = "👁️";
            }
        }

        async function initPage() {
            const res = await runCmd(`${DAEMON_BIN} status`);
            if (res.errno === 0 && res.stdout) {
                try {
                    const data = JSON.parse(res.stdout);
                    document.getElementById("statusText").innerText = data.driver_loaded ? "驱动正常运行" : "驱动待就绪";
                    
                    if (data.config && data.config.home_assistant) {
                        const ha = data.config.home_assistant;
                        document.getElementById("haLanSsid").value = ha.lan_ssid || "";
                        document.getElementById("haLanUrl").value = ha.internal_url || ha.base_url || "";
                        document.getElementById("haWanUrl").value = ha.external_url || "";
                        document.getElementById("haToken").value = ha.token || "";
                        document.getElementById("haEntityId").value = ha.entity_id || "event.action_button";
                    }

                    if (data.config && data.config.actions) {
                        const acts = data.config.actions;
                        document.getElementById("switchShortPress").checked = acts.short_press.enabled;
                        document.getElementById("selectShortPress").value = acts.short_press.action_type;

                        document.getElementById("switchDoubleTap").checked = acts.double_tap.enabled;
                        document.getElementById("selectDoubleTap").value = acts.double_tap.action_type;

                        document.getElementById("switchLongPress").checked = acts.long_press.enabled;
                        document.getElementById("selectLongPress").value = acts.long_press.action_type;
                    }

                    if (data.config && data.config.double_tap_timeout_ms) {
                        document.getElementById("doubleTapSlider").value = data.config.double_tap_timeout_ms;
                        document.getElementById("doubleTapVal").innerText = data.config.double_tap_timeout_ms + "ms";
                    }

                    if (data.config && data.config.long_press_timeout_ms) {
                        document.getElementById("longPressSlider").value = data.config.long_press_timeout_ms;
                        document.getElementById("longPressVal").innerText = data.config.long_press_timeout_ms + "ms";
                    }

                    log("配置加载完毕");
                } catch (e) {
                    log("解析配置失败");
                }
            } else {
                document.getElementById("statusText").innerText = "服务待命";
            }
            fetchDaemonLogs();
            setInterval(fetchDaemonLogs, 1500);
        }

        async function detectCurrentWifi() {
            log("正在识别当前 WiFi 属性...");
            const res = await runCmd(`${DAEMON_BIN} ha detect-lan`);
            if (res.errno === 0 && res.stdout) {
                try {
                    const data = JSON.parse(res.stdout);
                    if (data.success) {
                        if (data.ssid) {
                            document.getElementById("haLanSsid").value = data.ssid;
                            log(`已自动识别 WiFi: ${data.ssid}`);
                            showToast(`已填入 WiFi: ${data.ssid}`);
                        } else if (data.gateway) {
                            document.getElementById("haLanSsid").value = data.gateway;
                            log(`已自动识别网关: ${data.gateway}`);
                            showToast(`已填入网关: ${data.gateway}`);
                        }
                        if (!document.getElementById("haLanUrl").value.trim() && data.suggested_lan_url) {
                            document.getElementById("haLanUrl").value = data.suggested_lan_url;
                        }
                    } else {
                        log(`识别提示: ${data.message || "未能获取 WiFi 信息"}`);
                        showToast(data.message || "未能获取 WiFi 信息");
                    }
                } catch (e) {
                    log("解析识别结果失败");
                }
            } else {
                log("识别执行失败: " + (res.stderr || res.stdout));
            }
        }

        async function saveHaConfig() {
            const lanSsid = document.getElementById("haLanSsid").value.trim();
            const lan = document.getElementById("haLanUrl").value.trim();
            const wan = document.getElementById("haWanUrl").value.trim();
            const token = document.getElementById("haToken").value.trim();
            const entity = document.getElementById("haEntityId").value.trim() || "event.action_button";

            const res = await runCmd(`${DAEMON_BIN} config set-ha-dual "${lan}" "${wan}" "${lanSsid}" "${token}" "${entity}"`);
            if (res.errno === 0) {
                log("HA 配置已保存");
                showToast("HA 配置已保存");
            } else {
                log("保存失败: " + (res.stderr || res.stdout));
            }
        }

        async function testHaConnection() {
            log("正在测试连通性...");
            const res = await runCmd(`${DAEMON_BIN} ha test`);
            if (res.errno === 0) {
                log(res.stdout || "连接成功");
                showToast("连接成功");
            } else {
                log("连接失败: " + (res.stderr || res.stdout));
                showToast("连接失败");
            }
        }

        async function toggleGesture(gesture, enabled) {
            const res = await runCmd(`${DAEMON_BIN} config set ${gesture} enabled ${enabled}`);
            if (res.errno === 0) {
                log(`${gesture} 状态: ${enabled}`);
            }
        }

        async function changeActionType(gesture, actionType) {
            let defaultPayload = "";
            if (actionType === "ha") {
                defaultPayload = gesture === "short_press" ? "single" : (gesture === "double_tap" ? "double" : "long");
            } else if (actionType === "torch") {
                defaultPayload = "toggle";
            }

            await runCmd(`${DAEMON_BIN} config set ${gesture} action_type ${actionType}`);
            await runCmd(`${DAEMON_BIN} config set ${gesture} payload ${defaultPayload}`);
            log(`已更新动作: ${actionType}`);
            showToast("动作已更新");
        }

        async function updateDoubleTapTimeout(val) {
            document.getElementById("doubleTapVal").innerText = val + "ms";
            await runCmd(`${DAEMON_BIN} config set-timeout ${val}`);
            log(`双击时间窗: ${val}ms`);
        }

        async function updateLongPressTimeout(val) {
            document.getElementById("longPressVal").innerText = val + "ms";
            await runCmd(`${DAEMON_BIN} config set-longpress-timeout ${val}`);
            log(`长按触发时间: ${val}ms`);
        }

        window.onload = initPage;
    </script>
</body>
</html>
